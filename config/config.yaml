# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.4.0  (优化版)
# ═══════════════════════════════════════════════════════════════
#
# 本次改动（其余全部保持你的原值）：
#   1. display.regions.standalone: false → true
#      你配了 standalone.platforms 和翻译范围，但显示开关是关的，
#      等于花钱让 AI 分析一批看不到的数据
#   2. ai.temperature: 1.0 → 0.7
#      翻译/分析需要稳定输出，1.0 偏高
#      ⚠️ 若你用的模型要求必须为 1.0（如部分 gpt-5 系），请改回 1.0
#   3. storage.local.retention_days: 0 → 90
#      0 = 永久保留，SQLite + HTML 报告会一直增长
#
# ⚠️ 仍然需要你自己填（我没有你的密钥）：
#   - ai.api_key（建议改用环境变量 AI_API_KEY）
#   - notification.channels 里至少一个渠道的 webhook URL
#     否则 notification.enabled 开着也不会有任何消息送达
#
# ═══════════════════════════════════════════════════════════════


# 可视化配置编辑器地址: https://sansan0.github.io/TrendRadar/


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  # 时区配置（影响所有时间显示、调度系统判断、数据存储）
  timezone: "Asia/Shanghai"
  show_version_update: true           # 是否显示版本更新提示（true=显示, false=隐藏）


# ===============================================================
# 1.5 调度系统 —— 什么时间做什么事
#
# 预设模板：always_on / morning_evening / office_hours / night_owl / custom
# 详细时间线图请查看 config/timeline.yaml
#
# 💡 当前是关闭状态 + report.mode=current + new_items=false
#    意味着：每次运行都重推当前在榜内容，长热榜会反复出现
#    两个改法二选一（本文件未擅自改动）：
#      A. enabled: true → 交给 timeline 控制推送节奏
#      B. report.mode: "incremental" → 只推新增，零重复
# ===============================================================
schedule:
  enabled: false                        # 是否启用调度系统（true=启用, false=关闭）
  preset: "morning_evening"             # 预设模板名称


# ===============================================================
# 2. 数据源 - 热榜平台
#
# 数据来源于 newsnow 开源项目: https://github.com/ourongxing/newsnow
# expected_domain 做域名安全校验，防范链接劫持或数据篡改
# ===============================================================
platforms:
  enabled: true                         # 是否启用热榜平台抓取（true=启用, false=关闭）
  api_url: ""                            # 热榜数据 API 地址（留空使用默认地址）
  sources:
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "tieba"
      name: "贴吧"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "douyin"
      name: "抖音"
      expected_domain: "douyin.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"

    # ---- 科技垂类（补 frequency_words.txt 里企业/AI/芯片词组的弹药）----
    - id: "36kr"
      name: "36氪"
      expected_domain: "36kr.com"
    - id: "ithome"
      name: "IT之家"
      expected_domain: "ithome.com"
    - id: "v2ex"
      name: "V2EX"
      expected_domain: "v2ex.com"
    - id: "solidot"
      name: "Solidot"
      expected_domain: "solidot.org"

    # ---- 体育垂类（足球/欧冠/电竞词组的主要来源）----
    - id: "hupu"
      name: "虎扑"
      expected_domain: "hupu.com"

    # ---- 财经 / 国际视角 ----
    - id: "xueqiu"
      name: "雪球"
      expected_domain: "xueqiu.com"
    - id: "zaobao"
      name: "联合早报"
      expected_domain: "zaobao.com.sg"
      # ⚠️ expected_domain 同时校验 HTTPS + 域名，不匹配会整批丢弃该平台数据
      #    若日志里出现该平台为空的警告，先把 expected_domain 留空验证实际域名


# ===============================================================
# 3. 数据源 - RSS 订阅
#
# 与热榜数据分开存储，按时间流展示
# ⚠️ 关键词过滤只作用于热榜，RSS 区展示的是抓取到的全部文章
#    所以这里的每个源都会原样进推送，不宜贪多
# ===============================================================
rss:
  enabled: true                       # 是否启用 RSS 抓取（true=启用, false=关闭）

  freshness_filter:
    enabled: true                     # 是否启用新鲜度过滤
    max_age_days: 1                   # 最大文章年龄（天），0 = 禁用过滤
                                      # 💡 更新慢的博客建议放宽到 3~7，否则经常空区

  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"

    - id: "ruanyifeng"
      name: "阮一峰的网络日志"
      url: "http://www.ruanyifeng.com/blog/atom.xml"
      enabled: true                   # ✅ 已启用
      max_age_days: 7                 # ✅ 周更源，必须放宽窗口，否则 1 天过滤下永远推不出来

    - id: "yahoo-finance"
      name: "雅虎财经"
      url: "https://finance.yahoo.com/news/rssindex"

    # 自定义源示例
    # - id: "custom-feed"
    #   name: "自定义源"
    #   url: "https://example.com/feed.xml"
    #   enabled: false
    #   max_age_days: 0


# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "incremental"                 # daily = 当日汇总 | current = 当前榜单 | incremental = 增量（零重复）
                                      # ✅ 已改：只推送新增内容，长热点不再每次重复
                                      # 💡 后续若想要「晚间当日汇总」，再把 schedule.enabled 改成 true
                                      #    （preset 已经是 morning_evening，不用动）

  display_mode: "keyword"             # keyword = 按关键词分组 | platform = 按平台分组

  sort_by_position_first: true        # ✅ 已改：按 frequency_words.txt 的书写顺序展示
                                      # true = 顺序固定（企业→国家→科技→体育→电竞），扫读快
                                      # false = 按命中条数排序（多的在前）

  rank_threshold: 5                   # 排名高亮阈值（仅影响展示强调）

  max_news_per_keyword: 0             # 每个关键词最大显示数（0=不限制）
                                      # 词表里已用 @N 逐组限流，这里保持 0 即可


# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "keyword"                   # keyword = 关键词匹配，不调用 AI，零 token
                                      # ai = AI 智能分类，更灵活但每次消耗 token
  priority_sort_enabled: true         # 仅 method=ai 时生效


# ===============================================================
# 4.6 AI 智能筛选配置（仅 filter.method=ai 时生效）
# ===============================================================
ai_filter:
  batch_size: 200                     # 每批发送给 AI 的标题数
  batch_interval: 2                   # 分批间隔（秒），0=不等待

  min_score: 0                        # 推送最低分数阈值（0.0~1.0），0=不过滤
                                      # 💡 真正启用 ai 模式时建议 0.5~0.7 起步

  # interests_file: "finance.txt"     # 自定义兴趣描述，放 config/custom/ai/

  reclassify_threshold: 0.6           # 全量重分类触发阈值（0~1）

  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - new_items                       # 1️⃣ 新增热点区域
    - hotlist                         # 2️⃣ 热榜区域（关键词匹配 / AI 智能筛选）
    - rss                             # 3️⃣ RSS 订阅区域
    - standalone                      # 4️⃣ 独立展示区
    - ai_analysis                     # 5️⃣ AI 分析区域

  regions:
    hotlist: true                     # 热榜区域
    new_items: false                  # 新增热点区域（🆕 标记不受此开关影响）
    rss: true                         # RSS 订阅区域
    standalone: true                  # 独立展示区  ← 已启用（原 false）
                                      # 配合下方 platforms 列表，知乎+华尔街见闻完整榜单不过滤展示
                                      # 觉得太长就改回 false，并同步把 ai_analysis.include_standalone 改 false
    ai_analysis: true                 # AI 分析区域

  standalone:
    platforms: ["zhihu", "wallstreetcn-hot"]     # 热榜平台 ID 列表
    rss_feeds: []                                # RSS 源 ID 列表
    max_items: 20                                # 每个源最多展示条数（0=不限制）


# ===============================================================
# 6. 推送通知
#
# ⚠️ 安全警告：webhook 地址不要公开！
#    GitHub 部署请将 webhook 填入 GitHub Secrets，不要写在这里
#
# ⚠️ 当前所有渠道均为空 —— 必须至少填一个，否则不会有任何推送
#
# 📌 多账号：分号(;)分隔，如 "url1;url2;url3"
# ===============================================================
notification:
  enabled: true                       # 通知总开关（开启 schedule 后仍由它兜底）

  channels:
    feishu:
      webhook_url: ""                 # 飞书机器人 webhook URL

    dingtalk:
      webhook_url: ""                 # 钉钉机器人 webhook URL

    wework:
      webhook_url: ""                 # 企业微信机器人 webhook URL
      msg_type: "markdown"            # markdown(群机器人) | text(个人微信应用)

    telegram:
      bot_token: ""                   # Telegram Bot Token
      chat_id: ""                     # Telegram Chat ID

    email:
      from: ""                        # 发件人邮箱地址
      password: ""                    # 发件人邮箱密码或授权码
      to: ""                          # 收件人邮箱，多个用逗号分隔
      smtp_server: ""                 # SMTP 服务器（可选，留空自动识别）
      smtp_port: ""                   # SMTP 端口（可选，留空自动识别）
                                      # 💡 走邮件渠道必须把 storage.formats.html 设为 true

    ntfy:
      server_url: "https://ntfy.sh"   # ntfy 服务器地址
      topic: ""                       # ntfy 主题名称
      token: ""                       # ntfy 访问令牌（可选）

    bark:
      url: ""                         # Bark 推送 URL（https://api.day.app/your_device_key）

    slack:
      webhook_url: ""                 # Slack Incoming Webhook URL

    generic_webhook:
      webhook_url: ""                 # 通用 Webhook（Discord、Matrix、IFTTT 等）
      payload_template: ""            # JSON 模板，支持 {title} / {content} 占位符


# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"                     # auto | local | remote

  formats:
    sqlite: true                      # 主存储（必须保持 true）
    txt: false                        # TXT 快照
    html: true                        # HTML 报告（邮件推送/网页版报告必须为 true）

  local:
    data_dir: "output"                # 数据目录
    retention_days: 90                # 保留天数  ← 已改（原 0 = 永久保留）
                                      # SQLite + HTML 报告按天累积，建议 30~90

  remote:
    retention_days: 0                 # 远程保留天数（0=永久保留）

    endpoint_url: ""                  # S3 兼容端点（R2 / OSS / COS / S3 / MinIO）
    bucket_name: ""                   # 存储桶名称
    access_key_id: ""                 # 访问密钥 ID
    secret_access_key: ""             # 访问密钥
    region: ""                        # 区域（可选）

  pull:
    enabled: false                    # 启动时自动从远程拉取
    days: 7                           # 拉取最近 N 天的数据


# ===============================================================
# 8. AI 模型配置（ai_analysis / ai_translation / ai_filter 共用）
# ===============================================================
ai:
  # LiteLLM 格式: 提供商/模型名
  # 完整列表: https://docs.litellm.ai/docs/providers
  model: "deepseek/deepseek-chat"

  api_key: ""                         # ⚠️ 留空请务必设置环境变量 AI_API_KEY，否则 AI 功能全部失败

  api_base: ""                        # 自定义 API 地址（第三方中转站才需要）
                                      # 🔧 两步：api_base 填服务商地址 + model 加 "openai/" 前缀
                                      #    例：openai/deepseek-ai/DeepSeek-V3

  timeout: 120                        # 请求超时（秒）

  temperature: 0.7                    # 采样温度  ← 已改（原 1.0）
                                      # 翻译需要稳定输出，0.3~0.7 更合适
                                      # ⚠️ 部分模型（如 gpt-5）强制要求 1.0，报错就改回去

  max_tokens: 5000                    # 最大生成 token 数（API 不支持则设 0 禁用）

  num_retries: 4                      # 失败重试次数
  fallback_models: ["deepseek/deepseek-v4-flash"]
                                      # 💡 主备都是同一家，对方整体限流时一样会失败
                                      #    有条件建议跨商回退，如加一个 openai/gpt-4o-mini

  # extra_params:
  #   top_p: 1.0
  #   presence_penalty: 0.0
  #   stop: ["END"]


# ===============================================================
# 9. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true                       # 开启 schedule 后仍受此总开关约束
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"

  mode: "follow_report"               # follow_report | daily | current | incremental
  max_news_for_analysis: 50           # 参与分析条数上限（控制 token 成本的关键项）

  include_rss: false                  # RSS 不进分析，省 token
  include_standalone: true            # 独立展示区纳入分析（现已能在推送中看到）

  include_rank_timeline: true         # true = 完整排名轨迹（更准，多耗约 0.5~1 倍 token）
                                      # 想省成本改 false，只保留排名范围 + 出现次数


# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"

  batch_size: 100                     # 每批发送给 AI 的标题数
  batch_interval: 2                   # 分批间隔（秒），0=不等待

  scope:
    hotlist: false                    # 中文热榜无需翻译 ✓
    rss: true                         # 英文 RSS 翻译
    standalone: true                  # 独立展示区翻译


# ===============================================================
# 11. 高级设置
# ===============================================================
advanced:
  debug: false                        # 💡 首次跑通建议临时改 true，确认有数据再改回

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000            # 请求间隔（毫秒）
    use_proxy: false                  # 是否启用代理
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000            # 请求间隔（毫秒）
    timeout: 15                       # 请求超时（秒）
    use_proxy: false
    proxy_url: ""                     # 留空则使用 crawler.default_proxy

  weight:                             # 排序权重，合起来为 1
    rank: 0.6                         # 排名权重
    frequency: 0.3                    # 频次权重
    hotness: 0.1                      # 热度权重

  max_accounts_per_channel: 3         # 每个渠道最大账号数量

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3              # 批次发送间隔（秒）
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
